*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;
     color:hsl(var(--foreground));background:hsl(var(--background));-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:24px 24px 80px;display:flex;flex-direction:column;gap:28px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* One icon button. No System option: with no data-theme set the page already follows the
   OS via prefers-color-scheme, so "system" is the implicit default rather than a choice. */
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
        padding:0;border:1px solid hsl(var(--border));border-radius:999px;cursor:pointer;
        background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.theme-toggle:hover{color:hsl(var(--foreground))}
.theme-toggle svg{width:17px;height:17px;display:block}
/* Show the icon for the theme the click would switch TO. Light is the base case, so the
   moon shows by default; the dark cases below flip to the sun. */
.theme-toggle .icon-sun{display:none}
.theme-toggle .icon-moon{display:block}
:root[data-theme="dark"] .theme-toggle .icon-sun{display:block}
:root[data-theme="dark"] .theme-toggle .icon-moon{display:none}
@media (prefers-color-scheme:dark){
  .theme-toggle .icon-sun{display:block}
  .theme-toggle .icon-moon{display:none}
}
:root[data-theme="light"] .theme-toggle .icon-sun{display:none}
:root[data-theme="light"] .theme-toggle .icon-moon{display:block}
.tb-nav{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.zmp{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;text-decoration:none;
     padding:7px 14px;border-radius:calc(var(--radius) - 2px);
     background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.zmp:hover{opacity:.9}.zmp svg{width:20px;height:15px;display:block}
.zmp .brand-mark{height:16px;width:auto;display:block}
.zmp:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px}
/* Right-hand controls sit together so the primary ZMP link keeps the left edge. */
.tb-actions{display:inline-flex;align-items:center;gap:8px}
     border:1px solid hsl(var(--border));background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
         color:hsl(var(--muted-foreground));margin:0}
h1{font-size:clamp(28px,3.4vw,42px);font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0}
h3{font-size:16px;font-weight:600;margin:0}
p{margin:0;text-wrap:pretty}
header{display:flex;flex-direction:column;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:hsl(var(--muted-foreground));
      border-top:1px solid hsl(var(--border));border-bottom:1px solid hsl(var(--border));padding:10px 0}
.lede{font-size:16px;line-height:1.55;color:hsl(var(--foreground));max-width:78ch}
.brief{display:flex;flex-direction:column;gap:10px}
.brief-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brief-title{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:hsl(var(--primary))}
.brief-title svg{width:24px;height:17px;display:block;flex:none}
.brief-title .brand-mark{height:20px;width:auto;display:block;flex:none}
section{display:flex;flex-direction:column;gap:12px}
.card{background:hsl(var(--card));color:hsl(var(--card-foreground));border:1px solid hsl(var(--border));
      border-radius:var(--radius);padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:3px;background:hsl(var(--muted));
     border-radius:calc(var(--radius) - 2px);padding:16px 18px}
.kpi .n{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--muted-foreground))}
.kpi .note{font-size:13px;color:hsl(var(--muted-foreground))}
/* Delta direction is derived from the numbers, never authored. "flat" covers both a
   genuine zero change and the case where no prior-period baseline exists. */
.kpi .d{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;gap:5px}
.kpi .d.up{color:hsl(var(--ramp-1))}
.kpi .d.down{color:hsl(var(--destructive))}
.kpi .d.flat{color:hsl(var(--muted-foreground));font-weight:500}
.scroller{overflow-x:auto}
svg{display:block;width:100%;height:auto}
.chartwrap{position:relative}
.tip{position:absolute;pointer-events:none;opacity:0;z-index:3;left:0;top:0;transform:translate(-50%,-125%);
     background:hsl(var(--popover));color:hsl(var(--popover-foreground));border:1px solid hsl(var(--border));
     border-radius:calc(var(--radius) - 2px);padding:8px 10px;font-size:12px;line-height:1.35;white-space:nowrap;
     box-shadow:0 8px 24px hsl(var(--foreground)/.12);transition:opacity 120ms ease}
.tip b{font-variant-numeric:tabular-nums}
.caption{font-size:12px;color:hsl(var(--muted-foreground));margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid hsl(var(--border))}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
   color:hsl(var(--muted-foreground));cursor:pointer;white-space:nowrap}
th:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:-2px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:hsl(var(--accent))}
.notes{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;
       color:hsl(var(--muted-foreground))}
.empty{padding:24px;text-align:center;color:hsl(var(--muted-foreground));font-size:14px}
footer{border-top:1px solid hsl(var(--border));padding-top:16px;font-size:13px;color:hsl(var(--muted-foreground))}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Headless PDF rendering. The toggles are chrome, so they go; and the dark tokens have to be

   outranks a bare `:root`, so all three selectors are listed rather than just the first. */
@media print{

    --background:0 0% 100%; --foreground:0 0% 0%;

    --primary:221 83% 40%; --primary-foreground:0 0% 100%;
    --secondary:0 0% 96%; --secondary-foreground:0 0% 0%;
    --muted:0 0% 96%; --muted-foreground:0 0% 32%;
    --accent:0 0% 96%; --accent-foreground:0 0% 0%;
    --border:0 0% 78%; --input:0 0% 78%;
  }
  @page{margin:14mm}
  /* Keep chart fills — browsers drop backgrounds when printing unless told otherwise. */
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar{display:none}
  section,.card{break-inside:avoid}
  h2,h3{break-after:avoid}
}

<script>
(function(){
  'use strict';
  var D = JSON.parse(document.getElementById('studio-data').textContent);
  var $ = function(id){ return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  var esc = function(s){ var e = document.createElement('div'); e.textContent = s == null ? '' : s; return e.innerHTML; };
  var css = function(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); };
  var hsl = function(n){ return 'hsl(' + css(n) + ')'; };
  function el(tag, attrs, text){
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  function hide(id){ var s = $(id); if (s) s.remove(); }
  function empty(node, msg){ node.innerHTML = '<p class="empty">' + esc(msg) + '</p>'; }
  function fit(s, max){ s = String(s); return s.length <= max ? s : s.slice(0, max - 1).replace(/[\s,\-]+$/, '') + '…'; }
  var num = function(v){ return v == null || !isFinite(Number(v)) ? null : Number(v); };

  /* The gateway returns rate metrics as fractions of the denominator (open_rate 0.0976
     means 9.76%). Printing the raw fraction with a percent sign understates by 100x, so
     every rate is scaled here, in one place, rather than at each call site. */
  function scale(v, unit){ v = num(v); return v == null ? null : (unit === 'rate' ? v * 100 : v); }
  function fmt(v, unit){
    v = num(v);
    if (v == null) return '—';
    if (unit === 'rate') return (Math.round(v * 1000) / 10).toFixed(2) + '%';
    if (unit === 'percent') return (Math.round(v * 100) / 100) + '%';
    if (unit === 'money') return '$' + Math.round(v).toLocaleString('en-US');
    return Math.abs(v) < 1 && v !== 0 ? String(v) : Math.round(v).toLocaleString('en-US');
  }
  function dayLabel(t){
    // engagement_date arrives as "2026-07-01T00:00:00" and engagement_month as
    // "2026-07-01 00:00:00" — same value, different separator. Normalise both.
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(t));
    if (!m) return String(t);
    return String(Number(m[3])) + ' ' +
      ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[2]) - 1];
  }

  // Theme: no explicit default. With no data-theme attribute the CSS already follows the OS
  // via prefers-color-scheme, so the page starts on the viewer's system setting implicitly.
  // Clicking sets an explicit override for the session; the label always names the target.
  (function(){
    var btn = $('theme-toggle');
    if (!btn) return;
    var prefersDark = matchMedia('(prefers-color-scheme: dark)');
    function effective(){
      var set = document.documentElement.getAttribute('data-theme');
      return set ? set : (prefersDark.matches ? 'dark' : 'light');
    }
    function label(){
      btn.setAttribute('aria-label', 'Switch to ' + (effective() === 'dark' ? 'light' : 'dark') + ' theme');
    }
    btn.addEventListener('click', function(){
      document.documentElement.setAttribute('data-theme', effective() === 'dark' ? 'light' : 'dark');
      label();
      renderCharts();
    });
    // While no explicit choice has been made, track the OS.
    var onChange = function(){ if (!document.documentElement.getAttribute('data-theme')){ label(); renderCharts(); } };
    (prefersDark.addEventListener ? prefersDark.addEventListener.bind(prefersDark, 'change')
                                  : prefersDark.addListener.bind(prefersDark))(onChange);
    label();
  })();

  var zmp = $('zmp-link');
  if (D.zmpUrl && D.zmpUrl.indexOf('http') === 0) {
    zmp.removeAttribute('target');
    zmp.href = D.zmpUrl;
  } else zmp.remove();

  $('title').textContent = D.title || 'Insights Studio';
  $('m-dataset').textContent = D.dataset || '';
  $('m-range').textContent = D.current
    ? (D.current.label || (D.current.start + ' to ' + D.current.end)) +
      (D.comparison ? ' vs ' + (D.comparison.label || (D.comparison.start + ' to ' + D.comparison.end)) : '')
    : '';
  $('m-account').textContent = D.account || '';
  $('m-site').textContent = D.siteId ? 'Account: ' + D.siteId : '';
  $('summary').textContent = D.summary || '';
  // The brief is labelled "Executive Summary". The chip carries the as-of date;
  // which engine produced the prose is recorded in the provenance footer, not the header,
  // so the reader gets one consistent label and the audit trail stays truthful.
  $('brief-stamp').textContent = D.asOf || '';
  $('provenance').textContent = D.provenance || '';

  /* ---- KPIs. The delta and its direction are computed from current/prior, never
     authored, so an arrow can never contradict the numbers beside it. A prior of zero
     or null yields no percentage at all: 0 -> 0 and 0 -> n are not percentage changes,
     and dividing them is where NaN and Infinity come from. */
  $('kpis').innerHTML = (D.kpis || []).map(function(k){
    var cur = num(k.current), pri = num(k.prior);
    var body = '<span class="n">' + esc(fmt(cur, k.unit)) + '</span>' +
               '<span class="l">' + esc(k.label) + '</span>';
    if (cur == null){
      body += '<span class="d flat">Not available for this period</span>';
    } else if (pri == null || pri === 0){
      body += '<span class="d flat">' + (pri === 0 ? 'No prior-period baseline' : 'No comparison available') + '</span>';
    } else {
      var pc = (cur - pri) / Math.abs(pri) * 100;
      var dir = Math.abs(pc) < 0.05 ? 'flat' : (pc > 0 ? 'up' : 'down');
      var arrow = dir === 'up' ? '↑' : (dir === 'down' ? '↓' : '→');
      body += '<span class="d ' + dir + '"><span aria-hidden="true">' + arrow + '</span>' +
              (dir === 'flat' ? 'no change' : (pc > 0 ? '+' : '') + (Math.round(pc * 10) / 10) + '%') +
              '</span>';
    }
    if (k.note) body += '<span class="note">' + esc(k.note) + '</span>';
    return '<div class="kpi">' + body + '</div>';
  }).join('');


  /* ---- Trend: line + area over a padded min/max axis.
     Rates here sit in a narrow band near the bottom of their possible range (6-18% of a
     0-100% scale), so a zero-anchored axis would flatten the whole series into one line
     at the foot of the chart. The axis is padded around the observed min and max instead,
     and the caption says so. A null point is a genuine gap — a day with no sends has no
     rate, which is not the same as a zero rate — so the path breaks there rather than
     diving to the axis. */
  var S = D.series || null;
  var trendPts = S && S.points ? S.points : [];
  var haveTrend = trendPts.filter(function(p){ return num(p.v) != null; }).length > 1;

  function drawTrend(){
    var svg = $('chart-trend');
    var L = 52, R = 20, T = 22, B = 42, PW = 820, PH = 260;
    var w = L + PW + R, h = T + PH + B, n = trendPts.length;
    svg.textContent = '';
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('style', 'max-width:' + w + 'px');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', (S.name || 'Metric') + ' by day');

    var muted = hsl('--muted-foreground'), border = hsl('--border'), ink = hsl('--ramp-2');
    var vals = trendPts.map(function(p){ return scale(p.v, S.unit); });
    var known = vals.filter(function(v){ return v != null; });
    var lo = Math.min.apply(null, known), hi = Math.max.apply(null, known);
    var pad = (hi - lo) * 0.15 || (Math.abs(hi) * 0.1) || 1;
    var min = lo - pad, max = hi + pad;
    var x = function(i){ return n < 2 ? L + PW / 2 : L + i * PW / (n - 1); };
    var y = function(v){ return T + (1 - (v - min) / (max - min)) * PH; };

    for (var g = 0; g <= 4; g++){
      var gy = T + g * PH / 4, gv = max - g * (max - min) / 4;
      svg.appendChild(el('line', { x1: L, y1: gy, x2: L + PW, y2: gy, stroke: border }));
      svg.appendChild(el('text', { x: L - 10, y: gy + 4, 'text-anchor': 'end', 'font-size': 11,
        fill: muted, style: 'font-variant-numeric:tabular-nums' },
        S.unit === 'rate' ? (Math.round(gv * 10) / 10) + '%' : fmt(gv, S.unit)));
    }

    // Split into contiguous runs of known values so gaps stay gaps.
    var runs = [], run = [];
    vals.forEach(function(v, i){
      if (v == null){ if (run.length) runs.push(run); run = []; }
      else run.push({ i: i, v: v });
    });
    if (run.length) runs.push(run);

    runs.forEach(function(r){
      if (r.length > 1){
        var d = r.map(function(p, k){ return (k ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
        svg.appendChild(el('path', { d: d + ' L' + x(r[r.length - 1].i).toFixed(1) + ' ' + (T + PH) +
          ' L' + x(r[0].i).toFixed(1) + ' ' + (T + PH) + ' Z', fill: ink, 'fill-opacity': '.14' }));
        svg.appendChild(el('path', { d: d, fill: 'none', stroke: ink, 'stroke-width': 2.5,
          'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      }
    });

    var step = Math.max(1, Math.ceil(n / 10));
    trendPts.forEach(function(p, i){
      if (i % step === 0){
        svg.appendChild(el('text', { x: x(i), y: T + PH + 20, 'text-anchor': 'middle',
          'font-size': 11, fill: muted }, dayLabel(p.t)));
      }
      var v = vals[i];
      if (v == null) return;
      var c = el('circle', { cx: x(i).toFixed(1), cy: y(v).toFixed(1), r: 3.5, fill: ink });
      c.appendChild(el('title', {}, dayLabel(p.t) + ': ' + fmt(p.v, S.unit)));
      svg.appendChild(c);
    });

    var tip = $('tip'), wrap = tip.parentNode;
    svg.querySelectorAll('circle').forEach(function(c, k){
      c.addEventListener('mouseenter', function(){
        var wr = wrap.getBoundingClientRect(), cr = c.getBoundingClientRect();
        tip.innerHTML = esc(c.textContent.split(': ')[0]) + ' &middot; <b>' + esc(c.textContent.split(': ')[1]) + '</b>';
        tip.style.left = (cr.left - wr.left + cr.width / 2) + 'px';
        tip.style.top = (cr.top - wr.top) + 'px';
        tip.style.opacity = 1;
      });
      c.addEventListener('mouseleave', function(){ tip.style.opacity = 0; });
    });

    var gaps = vals.filter(function(v){ return v == null; }).length;
    $('trend-caption').textContent = 'Axis is scaled to the observed range, not anchored at zero, so day-to-day' +
      ' movement stays visible.' + (gaps ? ' ' + gaps + (gaps === 1 ? ' day has' : ' days have') +
      ' no activity and are left as gaps rather than plotted as zero.' : '');
  }

  /* ---- Breakdown: ranked horizontal bars, anchored at zero.
     These are counts, so zero is the true origin and the bars are honest as ratios —
     unlike the trend's rates, which cluster in a narrow band. Rows whose value is zero
     are dropped from the chart (they would be indistinguishable zero-length bars) but
     kept in the table, and the caption says how many. If every charted value is
     identical the chart is dropped entirely: equal bars encode nothing. */
  var B = D.breakdown || null;
  var bRows = B && B.rows ? B.rows.filter(function(r){ return num(r.value) != null; }) : [];
  var chartRows = bRows.filter(function(r){ return num(r.value) !== 0; })
                       .sort(function(a, z){ return num(z.value) - num(a.value); });
  var flat = chartRows.length > 1 &&
             chartRows.every(function(r){ return num(r.value) === num(chartRows[0].value); });

  function drawBreakdown(){
    var svg = $('chart-breakdown');
    if (!chartRows.length || flat){
      empty(svg.parentNode, flat
        ? 'Every channel recorded the same value, so a bar chart would carry no information. See the table below.'
        : 'No non-zero values to chart. See the table below.');
      $('breakdown-caption').textContent = '';
      return;
    }
    var LW = 210, AW = 560, ROW = 34, T = 14, Bo = 12, PAD = 16;
    var w = LW + AW + PAD, h = T + chartRows.length * ROW + Bo;
    svg.textContent = '';
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('style', 'max-width:' + w + 'px');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', (B.metric || 'Value') + ' by ' + (B.dimension || 'category'));

    var muted = hsl('--muted-foreground'), border = hsl('--border'), bar = hsl('--ramp-2');
    var max = Math.max.apply(null, chartRows.map(function(r){ return num(r.value); }).concat([1]));
    svg.appendChild(el('line', { x1: LW, y1: T, x2: LW, y2: T + chartRows.length * ROW, stroke: border }));

    chartRows.forEach(function(r, i){
      var cy = T + i * ROW + ROW / 2, v = num(r.value);
      var lbl = el('text', { x: LW - 12, y: cy, 'text-anchor': 'end', 'dominant-baseline': 'middle',
        'font-size': 12, fill: muted }, fit(r.label, 26));
      lbl.appendChild(el('title', {}, r.label));
      svg.appendChild(lbl);
      var len = Math.max(2, (v / max) * (AW - 90));
      svg.appendChild(el('rect', { x: LW, y: cy - 9, width: len, height: 18, rx: 3, fill: bar }));
      svg.appendChild(el('text', { x: LW + len + 8, y: cy, 'dominant-baseline': 'middle',
        'font-size': 12, 'font-weight': 600, fill: muted,
        style: 'font-variant-numeric:tabular-nums' }, fmt(v, B.metricUnit)));
    });

    var zeros = bRows.length - chartRows.length;
    $('breakdown-caption').textContent = (B.metric || 'Value') + ' by ' + (B.dimension || 'category') +
      ', ranked, on a zero-anchored axis so bar lengths compare directly.' +
      (zeros ? ' ' + zeros + ' ' + (zeros === 1 ? 'row recorded' : 'rows recorded') +
      ' nothing in this period and ' + (zeros === 1 ? 'is' : 'are') + ' listed in the table only.' : '');
  }

  /* ---- Sortable table. Sorts the underlying numbers, not their formatted strings,
     so "1,056" does not sort below "99". */
  (function(){
    if (!B || !bRows.length){ return; }
    $('breakdown-title').textContent = B.title || 'Breakdown';
    var cols = [{ key: '__label', label: B.dimension || 'Category', unit: null },
                { key: '__value', label: B.metric || 'Value', unit: B.metricUnit }]
                .concat((B.columns || []).map(function(c){ return { key: c.key, label: c.label, unit: c.unit }; }));
    var raw = function(r, c){ return c.key === '__label' ? r.label
      : c.key === '__value' ? num(r.value) : num((r.cells || {})[c.key]); };
    var rows = bRows.slice(), sortCol = 1, dir = -1;
    var head = $('table').querySelector('thead'), body = $('table').querySelector('tbody');
    function render(){
      head.innerHTML = '<tr>' + cols.map(function(c, i){
        var on = i === sortCol, isNum = c.key !== '__label';
        return '<th tabindex="0" class="' + (isNum ? 'num' : '') + '" data-i="' + i + '"' +
          (on ? ' aria-sort="' + (dir < 0 ? 'descending' : 'ascending') + '"' : '') + '>' +
          esc(c.label) + (on ? ' <span aria-hidden="true">' + (dir < 0 ? '↓' : '↑') + '</span>' : '') + '</th>';
      }).join('') + '</tr>';
      body.innerHTML = rows.map(function(r){
        return '<tr>' + cols.map(function(c){
          var v = raw(r, c);
          return c.key === '__label'
            ? '<td>' + esc(v) + '</td>'
            : '<td class="num">' + esc(fmt(v, c.unit)) + '</td>';
        }).join('') + '</tr>';
      }).join('');
    }
    function sortBy(i){
      dir = (i === sortCol) ? -dir : -1;
      sortCol = i;
      var c = cols[i];
      rows.sort(function(a, z){
        var av = raw(a, c), zv = raw(z, c);
        if (c.key === '__label') return String(av).localeCompare(String(zv)) * dir;
        if (av == null) return 1;
        if (zv == null) return -1;
        return (av - zv) * dir;
      });
      render();
    }
    head.addEventListener('click', function(e){
      var th = e.target.closest('th'); if (th) sortBy(Number(th.dataset.i));
    });
    head.addEventListener('keydown', function(e){
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var th = e.target.closest('th'); if (th){ e.preventDefault(); sortBy(Number(th.dataset.i)); }
    });
    render();
  })();

  var notes = (D.notes || []).filter(function(n){ return n && String(n).indexOf('{{') === -1; });
  if (notes.length) $('notes').innerHTML = notes.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join('');
  else hide('sec-notes');

  if (!haveTrend) hide('sec-trend');
  if (!B || !bRows.length) hide('sec-breakdown');

  function renderCharts(){
    if (haveTrend) drawTrend();
    if (B && bRows.length) drawBreakdown();
  }
  renderCharts();
})();
</script>
</body>
</html>
